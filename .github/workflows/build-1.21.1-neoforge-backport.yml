name: Build 1.21.1 NeoForge UI backport

on:
  push:
    branches:
      - backport-3.2.2-ui-1.21.1-neoforge-21.1.247
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Minecraft 1.21.1 / NeoForge
        run: |
          chmod +x ./gradlew
          ./gradlew :1.21.1-neoforge:build \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Dorg.gradle.jvmargs="-Xmx4G -XX:+UseG1GC" \
            -Pfabric.loom.disable_file_lock=true

      - name: Verify UI classes are packaged
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find versions/1.21.1-neoforge/build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*sources*' ! -name '*dev*' | head -n 1)
          test -n "$JAR"
          test "$(stat -c%s "$JAR")" -gt 100000
          jar tf "$JAR" | grep -q 'net/nicguzzo/wands/client/screens/WandScreen.class'
          jar tf "$JAR" | grep -q 'net/nicguzzo/wands/client/ModeSelectorScreen.class'
          jar tf "$JAR" | grep -q 'net/nicguzzo/wands/client/screens/WandConfigScreen.class'
          echo "Verified: $JAR"

      - name: Upload backport JAR
        uses: actions/upload-artifact@v4
        with:
          name: BuildingWands-1.21.1-NeoForge-21.1.247-UI-backport
          retention-days: 30
          path: |
            versions/1.21.1-neoforge/build/libs/*.jar
            !versions/1.21.1-neoforge/build/libs/*sources*.jar
            !versions/1.21.1-neoforge/build/libs/*dev*.jar
