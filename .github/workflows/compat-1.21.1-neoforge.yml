name: Build MC 1.21.1 NeoForge compatibility

on:
  push:
    branches:
      - compat/3.2.2-mc1.21.1-neoforge-21.1.247
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply published 3.2.2 keybinding hotfix and version
        shell: python
        run: |
          from pathlib import Path

          client = Path("src/main/java/net/nicguzzo/wands/client/WandsModClient.java")
          text = client.read_text()
          marker = '    static final String k = "key.wands.";\n\n    public static void initialize() {\n'
          replacement = (
              '    static final String k = "key.wands.";\n'
              '    public static boolean initialized = false;\n\n'
              '    public static void initialize() {\n'
              '        if (initialized) return;\n'
              '        initialized = true;\n\n'
          )
          if 'public static boolean initialized' not in text:
              if marker not in text:
                  raise SystemExit("Could not locate WandsModClient initialize marker")
              text = text.replace(marker, replacement, 1)
              client.write_text(text)

          gradle = Path("build.gradle.kts")
          build = gradle.read_text()
          if 'val modVersionStr = "3.2.1"' in build:
              gradle.write_text(build.replace('val modVersionStr = "3.2.1"', 'val modVersionStr = "3.2.2"', 1))
          elif 'val modVersionStr = "3.2.2"' not in build:
              raise SystemExit("Unexpected modVersionStr")
      - name: Build 1.21.1 NeoForge target
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --info 2>&1 | tee build.log
      - name: Persist successful 3.2.2 source port
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- build.gradle.kts src/main/java/net/nicguzzo/wands/client/WandsModClient.java; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle.kts src/main/java/net/nicguzzo/wands/client/WandsModClient.java
          git commit -m 'Port BuildingWands 3.2.2 keybinding fix to 1.21.1'
          git push
      - name: Show built jars
        if: always()
        run: find . -path '*/build/libs/*.jar' -type f -print
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildingWands-1.21.1-neoforge-diagnostics
          path: |
            build.log
            **/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: warn

  recover-3-2-2-keybinding-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compare published 3.2.1 and 3.2.2 WandsModClient bytecode
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://edge.forgecdn.net/files/8605/424/BuildingWands_3.2.1_release_neoforge_26.2.jar' -o 3.2.1.jar
          curl -fL 'https://edge.forgecdn.net/files/8607/495/BuildingWands_3.2.2_release_neoforge_26.2.jar' -o 3.2.2.jar
          javap -classpath 3.2.1.jar -c -p net.nicguzzo.wands.client.WandsModClient > 3.2.1.txt
          javap -classpath 3.2.2.jar -c -p net.nicguzzo.wands.client.WandsModClient > 3.2.2.txt
          diff -u 3.2.1.txt 3.2.2.txt > keybinding.diff || true
          cat keybinding.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildingWands-3.2.2-keybinding-diff
          path: |
            3.2.1.txt
            3.2.2.txt
            keybinding.diff
          if-no-files-found: error
